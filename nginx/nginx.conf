user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ---------- Configs para grandes dashboards ----------
    client_max_body_size 50M;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # ---------- Upstream do Superset ----------
    upstream superset_app {
        server superset:8088;   # container superset
    }

    server {
        listen 80;
        server_name _;

        # Se você faz TLS no pfSense/HAProxy, deixe assim mesmo

        # ---------------- REVERSE PROXY ----------------
        location / {
            proxy_pass         http://superset_app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Websocket do Superset (para filtros dinâmicos e async queries)
        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_pass http://superset_app;
        }

    }

    # Você pode adicionar server 443 aqui
}
